<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">サイドクエスト（開発中）：日本語学習アプリ。復習キューを作り、純粋なDartのスケジューラで次回日時を決め、カード・復習ログ・統計を一つのFirestoreトランザクションで保存します。</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3ed38" stroke-opacity=".05"/></pattern></defs><style>.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><path d="M1 1H975L999 25V329H25L1 305Z" fill="#111414" stroke="#5c5d36"/><path d="M1 1H975L999 25V329H25L1 305Z" fill="url(#grid)"/><path d="M1 60V1H60M940 329H999V270" fill="none" stroke="#f3ed38" stroke-width="2"/><path d="M0 0H640L616 52H0Z" fill="#f3ed38"/><text x="30" y="35" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="19" font-weight="900" fill="#0b0e0e" letter-spacing="1" text-anchor="start">サイドクエスト // セーブ機能つき日本語学習</text><path d="M780 18H966V50H764Z" fill="#ff495c"/><rect class="pulse" x="782" y="29" width="10" height="10" fill="#0b0e0e"/><text x="804" y="40" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="15" font-weight="900" fill="#0b0e0e" letter-spacing="2" text-anchor="start">開発中</text><path d="M36 86H298L318 106V196H36Z" fill="#0b0e0e" stroke="#67e8ed" stroke-width="2"/><text x="54" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="900" fill="#67e8ed" letter-spacing="0" text-anchor="start">01</text><text x="106" y="126" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="18" font-weight="900" fill="#ededde" letter-spacing="0" text-anchor="start">キューを作る</text><text x="54" y="172" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',