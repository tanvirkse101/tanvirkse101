ans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" font-weight="700" fill="#67e8ed" letter-spacing="1" text-anchor="middle">次の復習 // 漢字はまたリスポーンする</text><text x="36" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#b8bdb1" letter-spacing="1" text-anchor="start">Flutter · Dart · Riverpod · Firestore</text></svg>
