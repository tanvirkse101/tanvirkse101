<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title"><title id="title">World map, three sync points: Dhaka 2015 to 2023, Miyazaki 2024 to 2025, Tsukuba 2025 to now.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3ed38" stroke-opacity=".05"/></pattern></defs><style>.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><path d="M1 1H975L999 25V269H25L1 245Z" fill="#111414" stroke="#5c5d36"/><path d="M1 1H975L999 25V269H25L1 245Z" fill="url(#grid)"/><path d="M1 60V1H60M940 269H999V210" fill="none" stroke="#f3ed38" stroke-width="2"/><text x="36" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#f3ed38" letter-spacing="2" text-anchor="start">A FEW PLACES IN MY STORY</text><path d="M170 132H830" stroke="#414638" stroke-width="3" stroke-dasharray="10 8"/><path d="M170 110L192 132L170 154L148 132Z" fill="#0b0e0e" stroke="#f3ed38" stroke-width="3"/><path d="M170 122L180 132L170 142L160 132Z" fill="#f3ed38"/><text x="170" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#f3ed38" letter-spacing="2" text-anchor="middle">SYNC 01</text><text x="170" y="194" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#ededde" letter-spacing="-0.5" text-anchor="middle">Dhaka</text><text x="170" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f3ed38" letter-spacing="1" text-anchor="middle">2015 – 2023</text><text x="170" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b8bdb1" letter-spacing="0" text-anchor="middle">Bangladesh</text><path d="M500 110L522 132L500 154L478 132Z" fill="#0b0e0e" stroke="#f3ed38" stroke-width="3"/><path d="M500 122L510 132L500 142L490 132Z" fill="#f3ed38"/><text x="500" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#f3ed38" letter-spacing="2" text-anchor="middle">SYNC 02</text><text x="500" y="194" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#ededde" letter-spacing="-0.5" text-anchor="middle">Miyazaki</text><text x="500" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f3ed38" letter-spacing="1" text-anchor="middle">2024 – 2025</text><text x="500" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b8bdb1" letter-spacing="0" text-anchor="middle">Japan</text><path d="M830 110L852 132L830 154L808 132Z" fill="#0b0e0e" stroke="#67e8ed" stroke-width="3"/><path class="pulse" d="M830 122L840 132L830 142L820 132Z" fill="#67e8ed"/><text x="830" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#67e8ed" letter-spacing="2" text-anchor="middle">SYNC 03</text><text x="830" y="194" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#ededde" letter-spacing="-0.5" text-anchor="middle">Tsukuba</text><text x="830" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#67e8ed" letter-spacing="1" text-anchor="middle">2025 – now</text><text x="830" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#b8bdb1" letter-spacing="0" text-anchor="middle">Japan</text><path d="M864 123H978L970 141H864Z" fill="#67e8ed"/><text x="870" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="900" fill="#0b0e0e" letter-spacing="0.5" text-anchor="start">YOU ARE HERE</text></svg>
