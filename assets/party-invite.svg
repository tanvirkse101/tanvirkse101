<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title"><title id="title">Talk games, swap recommendations, or build something together. Say hello.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3ed38" stroke-opacity=".05"/></pattern></defs><style>.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><path d="M1 1H975L999 25V209H25L1 185Z" fill="#111414" stroke="#5c5d36"/><path d="M1 1H975L999 25V209H25L1 185Z" fill="url(#grid)"/><path d="M1 60V1H60M940 209H999V150" fill="none" stroke="#f3ed38" stroke-width="2"/><text x="36" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#67e8ed" letter-spacing="2" text-anchor="start">GOOD CONVERSATIONS START HERE</text><text x="36" y="104" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#ededde" letter-spacing="0" text-anchor="start">Games. Music. Good stories.</text><text x="36" y="150" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#ededde" letter-spacing="0" text-anchor="start">Got a recommendation?</text><path d="M640 70H688V118H640Z" fill="#f3ed38" fill-opacity=".9"/><path d="M702 70H750V118H702Z" fill="#67e8ed" fill-opacity=".9"/><path d="M764 70H812V118H764Z" fill="#f3ed38" fill-opacity=".9"/><path d="M826 70H874V118H826Z" fill="#67e8ed" fill-opacity=".9"/><path d="M888 70H936V118H888Z" fill="none" stroke="#ff495c" stroke-width="2" stroke-dasharray="5 4"/><text x="912" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="900" fill="#ff495c" letter-spacing="0" text-anchor="middle">?</text><path d="M640 140H936L956 160V178H660L640 158Z" fill="#f3ed38"/><text x="798" y="166" font-