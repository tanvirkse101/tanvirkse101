<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">Tanvir Ahamed. Games, good stories, and an Avicii soundtrack. Tsukuba, Japan.</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3ed38" stroke-opacity=".05"/></pattern></defs><style>.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><path d="M1 1H975L999 25V439H25L1 415Z" fill="#111414" stroke="#5c5d36"/><path d="M1 1H975L999 25V439H25L1 415Z" fill="url(#grid)"/><path d="M1 60V1H60M940 439H999V380" fill="none" stroke="#f3ed38" stroke-width="2"/><path d="M0 0H600L630 30V440H0Z" fill="#f3ed38"/><path d="M36 32H400L384 70H36Z" fill="#0b0e0e"/><text x="50" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f3ed38" letter-spacing="2" text-anchor="start">PLAYER ONE // PRESS START</text><text x="30" y="172" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="112" font-weight="900" fill="#0b0e0e" letter-spacing="-5" text-anchor="start">TANVIR</text><text x="30" y="274" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="112" font-weight="900" fill="#0b0e0e" letter-spacing="-5" text-anchor="start">AHAMED</text><path d="M34 184h58v5H34M496 112h82v5h-82M220 286h70v5h-70" stroke="#ff495c" stroke-width="3"/><path d="M30 300H590L572 336H30Z" fill="#0b0e0e"/><text x="44" y="326" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f3ed38" letter-spacing="0" text-anchor="start">Gamer · Software engineer · Tsukuba, Japan</text><text x="32" y="382" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="23" font-weight="900" fill="#0b0e0e" letter-spacing="0" text-anchor="start" font-style="italic">Games, good stories,</text><text x="32" y="414" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="23" font-weight="900" fill="#0b0e0e" letter-spacing="0" text-anchor="start" font-style="italic">and an Avicii soundtrack.</text><text x="664" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#67e8ed" letter-spacing="3" text-anchor="start">SAVE FILE // 01</text><path d="M664 78H960" stroke="#414638"/><text x="664" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b8bdb1" letter-spacing="2" text-anchor="start">GAMES</text><text x="664" y="146" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ededde" letter-spacing="0" text-anchor="start">Dota 2 / Assassin’s Creed</text><text x="664" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b8bdb1" letter-spacing="2" text-anchor="start">SOUNDTRACK</text><text x="664" y="216" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ededde" letter-spacing="0" text-anchor="start">Avicii</text><text x="664" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b8bdb1" letter-spacing="2" text-anchor="start">BASED IN</text><text x="664" y="286" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ededde" letter-spacing="0" text-anchor="start">Tsukuba, Japan</text><text x="664" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b8bdb1" letter-spacing="2" text-anchor="start">LANGUAGES</text><text x="664" y="356" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ededde" letter-spacing="0" text-anchor="start">Bengali · English · Japanese</text><rect class="pulse" x="664" y="397" width="10" height="10" fill="#67e8ed"/><text x="686" y="407" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#67e8ed" letter-spacing="1" text-anchor="start">WELCOME TO MY CORNER</text></svg>
